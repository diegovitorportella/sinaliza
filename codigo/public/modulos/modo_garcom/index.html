<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sinaliza - Modo Garçom</title>
    
    <!-- Fonte Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Textura de fundo padrão da identidade visual -->
    <div class="bg-pattern"></div>
    
    <!-- NAVBAR GLOBAL -->
    <nav class="navbar navbar-expand-lg glass-nav sticky-top mb-4">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="../../index.html">
                <div class="brand-icon">
                    <i class="bi bi-ear-fill text-warning"></i>
                </div>
                <span class="brand-text text-dark">Sinaliza<span class="text-primary">.</span></span>
            </a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" href="../../index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="../lista_restaurantes/index.html">Restaurantes</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active fw-bold" href="#">Modo Garçom</a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
                            Gerenciamento
                        </a>
                        <ul class="dropdown-menu shadow border-0 rounded-4">
                            <li><a class="dropdown-item py-2 fw-medium" href="../cadastro_de_usuarios/index.html"><i class="bi bi-person-fill-gear me-2 text-primary"></i> Perfil do Usuário</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- CONTEÚDO PRINCIPAL -->
    <div class="container py-4 position-relative z-1">
        <header class="mb-5 text-center d-flex flex-column align-items-center">
            <div class="badge-custom mb-3">
                <i class="bi bi-chat-dots-fill text-primary"></i> Comunicação Rápida
            </div>
            <h1 class="section-title text-dark">Modo Garçom</h1>
            <div class="title-underline"></div>
            <p class="hero-subtitle">Selecione uma frase para se comunicar facilmente com o atendimento.</p>
        </header>

        <!-- Barra de Busca -->
        <div class="d-flex justify-content-center mb-5">
            <div class="search-container w-100">
                <div class="search-glow"></div>
                <div class="search-box">
                    <i class="bi bi-search search-icon"></i>
                    <input type="text" id="inputPesquisa" class="search-input" placeholder="Buscar frase, ex: 'Água'...">
                </div>
            </div>
        </div>

        <!-- Categorias -->
        <div class="mb-5 d-flex gap-3 overflow-auto pb-3" id="containerCategorias">
            <!-- REGRAS MANTIDAS: class="btn-categoria" e data-categoria="Todas" -->
            <button class="btn btn-primary rounded-pill px-4 btn-categoria" data-categoria="Todas">Todas</button>
        </div>

        <!-- Grid de Frases -->
        <div class="row g-4" id="gridFrases"></div>
    </div>

    <!-- TELA CHEIA DA FRASE (Overlay Modernizado) -->
    <!-- REGRAS MANTIDAS: IDs, classes overlay-inativo e overlay-ativo -->
    <div id="overlayTelaCheia" class="overlay-inativo">
        <button id="btnFecharOverlay" aria-label="Fechar tela cheia">
            <i class="bi bi-x-lg"></i>
        </button>
        <div class="text-center p-4 content-overlay">
            <div id="overlayIcone" class="icone-overlay"></div>
            <h1 id="overlayTexto" class="texto-overlay"></h1>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
