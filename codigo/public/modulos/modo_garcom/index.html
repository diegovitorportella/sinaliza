<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sinaliza - Modo Garçom</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">
    
    <!-- NAVBAR GLOBAL -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold text-primary" href="../../index.html">
                <i class="bi bi-ear-fill text-warning"></i> Sinaliza
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" href="../../index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-warning" href="../lista_restaurantes/index.html">Restaurantes</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active fw-bold" href="#">Modo Garçom</a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
                            Gerenciamento
                        </a>
                        <ul class="dropdown-menu shadow">
                            <li><a class="dropdown-item" href="../cadastro_de_usuarios/index.html"><i class="bi bi-person-fill-gear"></i> Perfil do Usuário</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <header class="mb-4 text-center">
            <h1 class="fw-bold text-primary">Modo Garçom</h1>
            <p class="text-muted">Selecione uma frase para comunicação rápida.</p>
        </header>

        <div class="mb-4">
            <div class="input-group input-group-lg shadow-sm">
                <span class="input-group-text bg-white border-0"><i class="bi bi-search"></i></span>
                <input type="text" id="inputPesquisa" class="form-control border-0" placeholder="Buscar frase...">
            </div>
        </div>

        <div class="mb-4 d-flex gap-2 overflow-auto pb-2" id="containerCategorias">
            <button class="btn btn-primary rounded-pill px-4 btn-categoria" data-categoria="Todas">Todas</button>
        </div>

        <div class="row g-3" id="gridFrases"></div>
    </div>

    <!-- Tela Cheia da Frase -->
    <div id="overlayTelaCheia" class="overlay-inativo d-flex flex-column justify-content-center align-items-center">
        <button id="btnFecharOverlay" class="btn btn-lg text-white" aria-label="Fechar tela cheia">
            <i class="bi bi-x-circle-fill"></i>
        </button>
        <div class="text-center p-4">
            <div id="overlayIcone" class="icone-overlay mb-4"></div>
            <h1 id="overlayTexto" class="texto-overlay text-white fw-bold"></h1>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
