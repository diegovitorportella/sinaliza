<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sinaliza - Cadastro de Usuários</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="bg-pattern"></div>
    <main class="container">
        <section class="card">
            <div class="titulo">
                <h1>Faça seu Cadastro aqui</h1>
            </div>
            <form id="Usuario">
                <label for="nomeUsuario">Nome de Usuário:</label>
                <input type="text" id="nomeUsuario" placeholder="Ex: João da Silva">

                <label for="emailUsuario">Email:</label>
                <input type="text" id="emailUsuario" placeholder="Ex: joaosilva@gmail.com">

                <label for="senhaUsuario">Senha:</label>
                <input type="text" id="senhaUsuario" placeholder="Ex: joaodasilva123">

                <button type="submit" id="botaoCadastro">
                    Cadastrar Usuário
                </button>
            </form>

            <p id="mensagem"></p>

        </section>
    </main>
    <script src="script.js"></script>
</body>

</html>
