<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sinaliza - Cadastro de Restaurante</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="bg-pattern"></div>
    <main class="container">
        <section class="card">
            <div class="titulo">
                <h1>Faça seu Cadastro aqui</h1>
            </div>
            <form id="restaurante">
                <label for="nomeRestaurante">Nome do Restaurante:</label>
                <input type="text" id="nomeRestaurante" placeholder="Ex: Outback">

                <label for="cnpjRestaurante">CNPJ:</label>
                <input type="text" id="cnpjRestaurante" placeholder="Ex: xx.xxx.xxx/xxxx-xx">

                <label for="senhaRestaurante">Senha:</label>
                <input type="text" id="senhaRestaurante" placeholder="Ex: senha@123">

                <label for="estadoRestaurante">Estado:</label>
                <select id="estadoRestaurante">
                    <option value="">Selecione um estado</option>
                    <option value="AC">AC</option>
                    <option value="AL">AL</option>
                    <option value="AP">AP</option>
                    <option value="AM">AM</option>
                    <option value="BA">BA</option>
                    <option value="CE">CE</option>
                    <option value="DF">DF</option>
                    <option value="ES">ES</option>
                    <option value="GO">GO</option>
                    <option value="MA">MA</option>
                    <option value="MT">MT</option>
                    <option value="MS">MS</option>
                    <option value="MG">MG</option>
                    <option value="PA">PA</option>
                    <option value="PB">PB</option>
                    <option value="PR">PR</option>
                    <option value="PE">PE</option>
                    <option value="PI">PI</option>
                    <option value="RJ">RJ</option>
                    <option value="RN">RN</option>
                    <option value="RS">RS</option>
                    <option value="RO">RO</option>
                    <option value="RR">RR</option>
                    <option value="SC">SC</option>
                    <option value="SP">SP</option>
                    <option value="SE">SE</option>
                    <option value="TO">TO</option>
                </select>

                <label for="cidadeRestaurante">Cidade:</label>
                <input type="text" id="cidadeRestaurante" placeholder="Ex: Belo Horizonte"/>

                <label for="enderecoRestaurante">Endereço:</label>
                <input type="text" id="enderecoRestaurante" placeholder="Ex: Rua, Número - Bairro"/>

                <button type="submit" id="botaoCadastro">
                    Cadastrar Restaurante
                </button>
            </form>

            <p id="mensagem"></p>

        </section>
    </main>
    <script src="script.js"></script>
</body>

</html>
